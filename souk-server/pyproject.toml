[project]
name = "souk-server"
version = "0.1.0"
description = "The reference souk gateway: AG-UI + A2A over HTTP, and the gRPC relay providers connect out to"
requires-python = ">=3.12"
# This is where every I/O decision lives — which framework, which port,
# which TLS story — and why it is a separate distribution rather than an
# extra of `souk`: core cannot grow a uvicorn import without someone
# noticing they are in the wrong package.
dependencies = [
    "souk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "grpcio>=1.66",
    # Same reasoning as souk-agent-sdk's own pyproject.toml: the generated
    # grpc_gen/*_pb2.py stubs import google.protobuf directly.
    "protobuf>=5.26",
]

[project.optional-dependencies]
# Passed through to souk itself — a gateway wanting the Postgres backend
# installs `souk-server[postgres]` rather than reaching past this package.
postgres = ["souk[postgres]"]

[project.scripts]
souk-server = "souk_server.server:main"

# souk is a sibling directory, not a published dependency yet.
[tool.uv.sources]
souk = { path = "../souk", editable = true }

# grpcio-tools regenerates souk_server/grpc_gen from proto/souk.proto — see
# scripts/gen_proto.sh and this package's Dockerfile. Not a runtime
# dependency (only grpcio itself is, once the stubs exist). httpx drives the
# ASGI app in tests without binding a port.
[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk_server"]
