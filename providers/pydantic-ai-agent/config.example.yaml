souk_http_url: http://souk:8000
provider_name: AgentSouk demo stall

agents:
  - name: souk-guide
    description: Full-featured tour guide for this Souk — lists registered agents, inspects agent cards/skills, reports platform health stats, guides developers on connecting new agents, and delegates tasks (translation/summarization) via A2A.
    model: custom-openai
    system_prompt: >
      You are the official tour guide and developer assistant for this Souk (an open agent relay and gateway).
      Your capabilities:
      1. Agent Introspection: Use list_souk_agents to see what agents are online/registered. Never guess agent status.
      2. Agent Card Inspection: Use get_agent_card when users ask about an agent's specific skills, parameters, schemas, or details.
      3. Platform Status: Use get_souk_stats to report platform health, total registered agents, and active connections.
      4. Developer Onboarding: Use get_souk_developer_guide when developers ask how Souk works, how to connect an agent, or how Ed25519 identity works.
      5. Delegation Workflows: For short non-English text, use call_translator directly. For longer foreign passages to summarize, use call_summarizer (which delegates via a multi-hop A2A chain).
      Point users to the souk-directory UI (usually http://localhost:8080) for browsing agents and live web chat.
    mcp_servers: []
    souk_tools: true
    sub_agents:
      - name: translator
        a2a_url: http://souk:8000/a2a/translator/rpc
      - name: summarizer
        a2a_url: http://souk:8000/a2a/summarizer/rpc

  # Sits between souk-guide and translator — demonstrates a multi-hop A2A
  # chain (souk-guide -> summarizer -> translator), not just one level of
  # delegation. See README's "Verifying the flow" for using
  # GET /threads/{id}/tree to see the resulting call lineage.
  - name: summarizer
    description: Summarizes text, translating it first via a sub-agent if it isn't already in English.
    model: custom-openai
    system_prompt: >
      Summarize whatever text the user sends you in 2-3 sentences. If it
      isn't in English, use the call_translator tool to translate it
      first, then summarize the translation — don't summarize
      non-English text directly.
    mcp_servers: []
    sub_agents:
      - name: translator
        a2a_url: http://souk:8000/a2a/translator/rpc

  - name: translator
    description: Translates text to English.
    model: custom-openai
    system_prompt: >
      Translate whatever text the user sends you into English. Reply with
      only the translation, nothing else.
    mcp_servers: []
    sub_agents: []
    # Keep Your Own Key demo (see docs/keep-your-own-key.md): a caller
    # that starts a run with metadata.kyok.sessionId gets its LLM calls
    # routed through souk's /kyok/v1 relay and paid for with the caller's
    # own key instead of this container's LLM_API_KEY.
    use_kyok: true
