[project]
name = "agent-template"
version = "0.1.0"
description = "Generic pydantic-ai agent runner: config (system prompt + MCP servers) in, souk-connected AG-UI agent out"
requires-python = ">=3.12"
dependencies = [
    "souk-agent-sdk",
    "pydantic-ai[ag-ui]>=0.0.49",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[tool.uv.sources]
souk-agent-sdk = { workspace = true }

[project.scripts]
agent-template = "agent_template.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_template"]
