souk_http_url: http://souk:8000
provider_name: AgentSouk Hermes stall

agents:
  - name: hermes
    description: A real Hermes Agent (NousResearch) instance, wrapped as a souk provider via its own OpenAI-compatible API server.
    api_base: http://hermes:8642/v1
    api_key: ${HERMES_API_SERVER_KEY}
    model: hermes
    # Without these, Hermes derives its own session id from the first
    # message (two different souk threads can collide) and its
    # long-term memory isn't scoped per caller at all — see
    # openai_compat_agent/config.py's docstring.
    session_id_header: X-Hermes-Session-Id
    memory_scope_header: X-Hermes-Session-Key
