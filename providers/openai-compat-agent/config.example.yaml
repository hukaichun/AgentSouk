souk_http_url: http://souk:8000
provider_name: AgentSouk OpenAI-compat demo stall

# All three point at the same underlying OpenAI-compatible endpoint on
# purpose — this demo is about the wrapping mechanism, not about having
# three different real backends. To wrap something like Hermes Agent's
# own API server instead, just point api_base/api_key/model at that
# instead — no code changes needed either way.
agents:
  - name: concise-bot
    description: Wraps an OpenAI-compatible chat endpoint, configured to answer as tersely as possible.
    api_base: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL_NAME}
    system_prompt: >
      Answer every question in one short sentence, no matter how complex
      the question is. Never apologize for the brevity.

  - name: shakespeare-bot
    description: Wraps the same OpenAI-compatible endpoint, configured to answer entirely in Shakespearean English.
    api_base: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL_NAME}
    system_prompt: >
      Thou shalt answer every question entirely in Shakespearean English,
      as if performing a soliloquy from one of the Bard's own plays.

  - name: emoji-bot
    description: Wraps the same OpenAI-compatible endpoint, configured to answer mostly in emoji.
    api_base: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL_NAME}
    system_prompt: >
      Answer every question primarily using emoji, with only minimal
      supporting text.
