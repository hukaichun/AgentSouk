services:
  paradedb:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: souk
      POSTGRES_PASSWORD: souk
      POSTGRES_DB: souk
    ports:
      - "5433:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql

  souk:
    build:
      context: .
      dockerfile: souk/Dockerfile
    ports:
      - "8000:8000"
      - "50051:50051"
    depends_on:
      - paradedb
    environment:
      SOUK_DATABASE_URL: postgresql+psycopg://souk:souk@paradedb:5432/souk
      SOUK_PUBLIC_HTTP_URL: http://localhost:8000

  # Runs the pydantic-ai example provider (providers/pydantic-ai-agent) —
  # see providers/README.md for other provider examples, and
  # /agent-template for the minimal reference implementation this one
  # builds on top of.
  agent-demo:
    build:
      context: .
      dockerfile: providers/pydantic-ai-agent/Dockerfile
    depends_on:
      - souk
    volumes:
      - ./providers/pydantic-ai-agent/config.example.yaml:/app/config.yaml:ro
    environment:
      # config.example.yaml uses `model: custom-openai`, resolved by
      # pydantic_ai_agent.main.resolve_model against these — point them at
      # any OpenAI-compatible endpoint. Swap the model string to
      # "anthropic:claude-..." etc. instead and use ANTHROPIC_API_KEY if
      # you'd rather not run a custom endpoint.
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME}"
      LLM_API_KEY: "${LLM_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"

volumes:
  paradedb_data:
