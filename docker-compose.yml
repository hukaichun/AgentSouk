services:
  paradedb:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: souk
      POSTGRES_PASSWORD: souk
      POSTGRES_DB: souk
    ports:
      - "5433:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U souk -d souk"]
      interval: 2s
      timeout: 3s
      retries: 20

  souk:
    build:
      context: .
      dockerfile: souk/Dockerfile
    ports:
      - "8000:8000"
      - "50051:50051"
    depends_on:
      paradedb:
        condition: service_healthy
    environment:
      SOUK_DATABASE_URL: postgresql+psycopg://souk:souk@paradedb:5432/souk
      SOUK_PUBLIC_HTTP_URL: http://localhost:8000

  # Runs the pydantic-ai example provider (providers/pydantic-ai-agent) —
  # see providers/README.md for other provider examples, and
  # /agent-template for the minimal reference implementation this one
  # builds on top of.
  agent-demo:
    build:
      context: .
      dockerfile: providers/pydantic-ai-agent/Dockerfile
    depends_on:
      - souk
    volumes:
      - ./providers/pydantic-ai-agent/config.example.yaml:/app/config.yaml:ro
      # Without this, every rebuild/recreate of this container gets a
      # fresh identity (see souk_agent_sdk/identity.py) — the *old* one's
      # "souk-guide"/"translator" agent_ids are left behind as orphans (souk
      # doesn't 409 a fresh key registering the same names, it just mints
      # new, unrelated agent_ids for them — see souk/db.py's
      # UNIQUE(public_key, name)), and a second "translator" existing makes
      # the name-based route this demo's sub_agents config uses
      # (/a2a/translator/rpc) ambiguous (409) instead of resolving to the
      # live one. Persisting the key file is what makes
      # `docker compose up --build` idempotent across restarts.
      - agent_demo_identity:/data
    environment:
      SOUK_IDENTITY_KEY_PATH: /data/souk_identity.key
      # config.example.yaml uses `model: custom-openai`, resolved by
      # pydantic_ai_agent.main.resolve_model against these — point them at
      # any OpenAI-compatible endpoint. Swap the model string to
      # "anthropic:claude-..." etc. instead and use ANTHROPIC_API_KEY if
      # you'd rather not run a custom endpoint.
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME}"
      LLM_API_KEY: "${LLM_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"

  # Human-browsable directory + chat UI for the `souk` service above — see
  # souk-directory/README.md. Static output only (compiled TypeScript +
  # HTML/CSS), no runtime dependency on souk beyond its public HTTP API.
  souk-directory:
    build:
      context: souk-directory
    ports:
      - "8080:8080"
    depends_on:
      - souk

volumes:
  paradedb_data:
  agent_demo_identity:
