[project]
name = "funduq-llm-provider-sdk"
version = "0.1.0"
description = "What an LLM provider and funduq agree on, from the LLM provider's side: identity, the completion port, and its own policy seam"
requires-python = ">=3.12"
# Two dependencies, and the list is still the point (see funduq-provider-sdk's
# pyproject, whose discipline this package inherits): no httpx as a thing
# this package *uses*, no websockets, no litellm, and no funduq. A network
# binding — and the actual LLM client — is downstream's to build.
#
# - funduq-provider-sdk: identity is identity. An LLM provider proves itself
#   with the same Ed25519 machinery an agent provider does, and one keypair
#   may be both at once, so the keypair class is shared rather than restated.
# - openai: KYOK's wire shapes are OpenAI chat-completions and nobody
#   hand-writes them (the same rule that put ag-ui-protocol and a2a-sdk in
#   funduq's own list). Types only; no client is constructed here.
dependencies = [
    "funduq-provider-sdk",
    "openai>=1.50",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funduq_llm_provider_sdk"]

[tool.uv.sources]
funduq-provider-sdk = { path = "../funduq-provider-sdk", editable = true }
