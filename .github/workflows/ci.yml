name: CI

on:
  push:
  pull_request:

# Mirrors the repo's own "independent projects" shape (see README's
# Components section) — one job per subproject rather than one monolithic
# build, since any one of them can be built/shipped/forked on its own.
jobs:
  souk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: souk
          POSTGRES_PASSWORD: souk
          POSTGRES_DB: souk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
        working-directory: souk
      # No gRPC stubs here, and nothing to generate them with: souk depends
      # on no transport at all (see its pyproject). If this step ever comes
      # back, something has moved into core that shouldn't have.
      - run: uv run pytest -v
        working-directory: souk
        env:
          SOUK_DATABASE_URL: postgresql+psycopg://souk:souk@localhost:5432/souk
          SOUK_TOKEN_SIGNING_SECRET: ci-test-secret

      # The probes, which are the acceptance checks the design documents name
      # — a green suite is not the bar (see docs/work-objectives.md's opening
      # table for five things that were true while 210 tests passed). Each of
      # these reproduces a specific failure and asserts the verdict changed,
      # and each exits non-zero when it has not.
      #
      # Two of the five probes are deliberately *not* here.
      # `probe_multiprocess.py` is the target for the horizontal-scaling work
      # and currently fails 6/6 on purpose; `probe_broker_surface.py` reports
      # what escapes the broker rather than judging it. Listing them would
      # either break CI or quietly pass, and both would teach the wrong thing
      # about what is covered.
      - name: probes (schema agrees, on Postgres)
        run: uv run python ../scripts/probes/probe_schema_agrees.py
        working-directory: souk
        env:
          SOUK_DATABASE_URL: postgresql+psycopg://souk:souk@localhost:5432/souk
          SOUK_TOKEN_SIGNING_SECRET: ci-test-secret
      # The rest stand up their own throwaway SQLite file, so they must not
      # inherit the Postgres DSN above.
      - name: probes (schema agrees, run row vanishes, registration survives — SQLite)
        run: |
          uv run python ../scripts/probes/probe_schema_agrees.py
          uv run python ../scripts/probes/probe_run_row_vanishes.py
          uv run python ../scripts/probes/probe_registration_survives_a_new_database.py
        working-directory: souk
        env:
          SOUK_TOKEN_SIGNING_SECRET: ci-test-secret

  # The serving layer lives in its own repository (AgentSoukServer), which
  # carries its own CI — including the app-builds probe, since it is the
  # only place that can build the app.

  souk-agent-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
        working-directory: souk-agent-sdk
      - run: uv run bash ../scripts/gen_proto.sh souk_agent_sdk/grpc_gen
        working-directory: souk-agent-sdk
      # Import-sanity check that the SDK's public surface still loads
      # cleanly, kept alongside the real test suite below rather than
      # replaced by it — the two answer different questions.
      - run: uv run python -c "import souk_agent_sdk.client, souk_agent_sdk.a2a_client, souk_agent_sdk.identity"
        working-directory: souk-agent-sdk
      - run: uv run pytest -v
        working-directory: souk-agent-sdk

  # Exercises souk-agent-sdk as a real dependency (path source, not just
  # its own package) — catches accidental breakage of its public surface
  # from a consumer's point of view, without needing an LLM key to run a
  # full agent.
  agent-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev && uv run bash ../scripts/gen_proto.sh souk_agent_sdk/grpc_gen
        working-directory: souk-agent-sdk
      - run: uv sync
        working-directory: agent-template
      - run: uv run python -c "import agent_template.main"
        working-directory: agent-template

  pydantic-ai-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev && uv run bash ../scripts/gen_proto.sh souk_agent_sdk/grpc_gen
        working-directory: souk-agent-sdk
      - run: uv sync
        working-directory: providers/pydantic-ai-agent
      - run: uv run python -c "import pydantic_ai_agent.main"
        working-directory: providers/pydantic-ai-agent

  souk-client-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
        working-directory: souk-client-sdk
      - run: uv run pytest -v
        working-directory: souk-client-sdk

  souk-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: souk-directory
      - run: npm run build
        working-directory: souk-directory
