name: CI

on:
  push:
  pull_request:

# Mirrors the repo's own "independent projects" shape (see README's
# Components section) — one job per subproject rather than one monolithic
# build, since any one of them can be built/shipped/forked on its own.
jobs:
  souk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: souk
          POSTGRES_PASSWORD: souk
          POSTGRES_DB: souk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
        working-directory: souk
      # No gRPC stubs here, and nothing to generate them with: souk depends
      # on no transport at all (see its pyproject). If this step ever comes
      # back, something has moved into core that shouldn't have.
      - run: uv run pytest -v
        working-directory: souk
        env:
          SOUK_DATABASE_URL: postgresql+psycopg://souk:souk@localhost:5432/souk
          SOUK_TOKEN_SIGNING_SECRET: ci-test-secret

  # Everything else — the gateway, both SDKs, the reference providers and
  # the directory UI — lives in AgentSoukServer, which carries its own CI,
  # including the app-builds probe only it can run.

