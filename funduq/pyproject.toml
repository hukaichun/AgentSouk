[project]
name = "funduq"
version = "0.1.0"
description = "funduq core — the network-free library: agents, threads, runs, and the protocol adapters"
requires-python = ">=3.12"
# No fastapi, uvicorn, sse-starlette or grpcio here, and that is the point:
# this repo implements no transport — its code neither listens nor dials —
# so no serving framework is asked for (see docs/library-architecture.md).
# Serving lives in the funduq-server repository, which consumes this package
# via a submodule. Dependencies whose bellies contain network code are fine
# (a2a-sdk ships httpx unconditionally); the defense forbids verbs, not
# nouns — see tests/test_core_is_network_free.py.
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    # SQLite is funduq's zero-config default backend (see funduq/config.py's
    # database_url), so its async driver is a core dependency — a plain
    # `pip install funduq` runs out of the box. Postgres is opt-in via the
    # `postgres` extra below.
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "ag-ui-protocol>=0.1.19",
    # A2A's own types, for the same reason ag-ui-protocol is here: funduq used
    # to hand-write both sides of this protocol as string literals, and a
    # spec that nothing imports rots silently — funduq was still answering
    # `tasks/send` and emitting `{"type": "text"}` parts two protocol
    # versions after they were renamed, and nothing failed until a real
    # client got -32601.
    #
    # Quoting the SDK is the shortcut to staying current, so its vocabulary
    # half is welcome anywhere in funduq: a2a.types (the v1.0 protobuf
    # definitions and the A2AService descriptor the method names are read
    # from), a2a.utils (error tables, task folding), a2a.extensions. Its I/O
    # half — a2a.client and the serving stack — is forbidden to our code,
    # and the serving extras (`http-server`, `grpc`, `fastapi`) are
    # deliberately not requested. The base install brings httpx along; that
    # is a noun in a wheel, not a verb in our code — see
    # tests/test_core_is_network_free.py for the line and its enforcement.
    "a2a-sdk>=1.1,<2",
    # KYOK's wire shapes are OpenAI chat-completions, and funduq hand-writes
    # no protocol (same rule as ag-ui-protocol and a2a-sdk above). Only
    # openai.types.* is imported — the package's client half is a dialing
    # verb and tests/test_core_is_network_free.py forbids it to our code.
    "openai>=1.50",
    "cryptography>=42.0",
    "pyjwt>=2.9",
    # Schema migrations — run as `alembic upgrade head` (see
    # funduq/alembic/), a separate step from starting the server, not
    # triggered by it. Lets deployments use DDL-capable credentials only
    # for that step and a DML-only role for the running server.
    "alembic>=1.13",
]

[project.optional-dependencies]
# The Postgres backend: `pip install funduq[postgres]`, then point
# FUNDUQ_DATABASE_URL at a `postgresql+psycopg://…` DSN. Needed for any real
# multi-writer gateway deployment (SQLite's single-writer locking is fine
# for dev/CI/single-node but not a busy gateway — see funduq/config.py).
postgres = ["psycopg[binary,pool]>=3.2"]

# pytest/pytest-asyncio are for funduq/tests/. The suite runs against SQLite
# out of the box; set FUNDUQ_DATABASE_URL to a Postgres DSN (and install the
# `postgres` extra) to run it against Postgres too — see CONTRIBUTING.md.
# psycopg is pulled into the dev group so the Postgres path is always
# testable locally without the extra. Nothing here speaks a protocol on the
# wire; tests/test_core_is_network_free.py is what enforces that, and it
# checks what our code does, not what happens to be installed (httpx is
# installed regardless — a2a-sdk brings it).
[dependency-groups]
dev = [
    # funduq's own suite registers through the provider SDK rather than through
    # funduq's signing helpers, so the payload a provider actually sends is
    # checked against the one funduq expects on every test run. Signing with
    # funduq's own builder meant both sides moved together: an operation prefix
    # was added, 219 tests passed, and no provider in the world could register
    # any more. See funduq_provider_sdk.identity.
    "funduq-provider-sdk",
    # Same second-opinion arrangement for the KYOK side: the suite
    # registers and serves completions through the LLM provider SDK, so
    # its payload and the protocol it satisfies are checked against
    # funduq's own on every run.
    "funduq-llm-provider-sdk",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "psycopg[binary,pool]>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funduq"]

[tool.uv.sources]
# Editable, and that matters: a non-editable path install copies the SDK
# into the venv, so its signing payloads freeze at sync time and a change to
# them would not fail a local test run — only a fresh CI install. The copy is
# only a second opinion if it is the live one.
funduq-provider-sdk = { path = "../funduq-provider-sdk", editable = true }
funduq-llm-provider-sdk = { path = "../funduq-llm-provider-sdk", editable = true }
