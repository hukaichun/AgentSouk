souk_http_url: http://souk:8000
souk_grpc_url: souk:50051

agents:
  - name: greeter
    description: Friendly demo agent that can delegate translation to a sub-agent.
    model: anthropic:claude-haiku-4-5-20251001
    system_prompt: >
      You are a friendly demo agent for Agent Souk. If the user's message
      isn't in English, use the call_translator tool to translate it to
      English first, then reply normally.
    mcp_servers: []
    sub_agents:
      - name: translator
        a2a_url: http://souk:8000/a2a/translator/rpc

  - name: translator
    description: Translates text to English.
    model: anthropic:claude-haiku-4-5-20251001
    system_prompt: >
      Translate whatever text the user sends you into English. Reply with
      only the translation, nothing else.
    mcp_servers: []
    sub_agents: []
