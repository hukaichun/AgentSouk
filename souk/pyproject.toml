[project]
name = "souk"
version = "0.1.0"
description = "Agent Souk core — the network-free library: agents, threads, runs, and the protocol adapters"
requires-python = ">=3.12"
# No fastapi, uvicorn, sse-starlette or grpcio here, and that is the point:
# core knows a database and nothing else, so it cannot import a transport
# even by accident (see docs/library-architecture.md). Serving lives in the
# AgentSoukServer repository, which consumes this package via a submodule.
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    # SQLite is souk's zero-config default backend (see souk/config.py's
    # database_url), so its async driver is a core dependency — a plain
    # `pip install souk` runs out of the box. Postgres is opt-in via the
    # `postgres` extra below.
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "ag-ui-protocol>=0.1.19",
    # A2A's own types, for the same reason ag-ui-protocol is here: souk used
    # to hand-write both sides of this protocol as string literals, and a
    # spec that nothing imports rots silently — souk was still answering
    # `tasks/send` and emitting `{"type": "text"}` parts two protocol
    # versions after they were renamed, and nothing failed until a real
    # client got -32601.
    #
    # Only the types are used (a2a.types.a2a_pb2 — the v1.0 protobuf
    # definitions and the A2AService descriptor the method names are read
    # from). None of the SDK's client, server or transport code is imported;
    # those live behind extras (`http-server`, `grpc`, `fastapi`) that are
    # deliberately not requested, so core stays free of a framework. Its base
    # install does bring httpx and protobuf along, which is the one real cost
    # here — see tests/test_core_is_network_free.py, which is now the only
    # thing keeping core from importing them.
    "a2a-sdk>=1.1,<2",
    # KYOK's wire shapes are OpenAI chat-completions, and souk hand-writes
    # no protocol (same rule as ag-ui-protocol and a2a-sdk above). Only
    # openai.types.* is imported — no client is ever constructed; like
    # a2a-sdk, the base install drags httpx along, and
    # tests/test_core_is_network_free.py is what keeps core from importing
    # it.
    "openai>=1.50",
    "cryptography>=42.0",
    "pyjwt>=2.9",
    # Schema migrations — run as `alembic upgrade head` (see
    # souk/alembic/), a separate step from starting the server, not
    # triggered by it. Lets deployments use DDL-capable credentials only
    # for that step and a DML-only role for the running server.
    "alembic>=1.13",
]

[project.optional-dependencies]
# The Postgres backend: `pip install souk[postgres]`, then point
# SOUK_DATABASE_URL at a `postgresql+psycopg://…` DSN. Needed for any real
# multi-writer gateway deployment (SQLite's single-writer locking is fine
# for dev/CI/single-node but not a busy gateway — see souk/config.py).
postgres = ["psycopg[binary,pool]>=3.2"]

# pytest/pytest-asyncio are for souk/tests/. The suite runs against SQLite
# out of the box; set SOUK_DATABASE_URL to a Postgres DSN (and install the
# `postgres` extra) to run it against Postgres too — see CONTRIBUTING.md.
# psycopg is pulled into the dev group so the Postgres path is always
# testable locally without the extra. No httpx or grpcio-tools: nothing here
# speaks a protocol, and the test that enforces that (tests/
# test_core_is_network_free.py) would have nothing to catch if a transport
# were installed alongside anyway.
[dependency-groups]
dev = [
    # souk's own suite registers through the provider SDK rather than through
    # souk's signing helpers, so the payload a provider actually sends is
    # checked against the one souk expects on every test run. Signing with
    # souk's own builder meant both sides moved together: an operation prefix
    # was added, 219 tests passed, and no provider in the world could register
    # any more. See souk_provider_sdk.identity.
    "souk-provider-sdk",
    # Same second-opinion arrangement for the KYOK side: the suite
    # registers and serves completions through the LLM provider SDK, so
    # its payload and the protocol it satisfies are checked against
    # souk's own on every run.
    "souk-llm-provider-sdk",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "psycopg[binary,pool]>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk"]

[tool.uv.sources]
# Editable, and that matters: a non-editable path install copies the SDK
# into the venv, so its signing payloads freeze at sync time and a change to
# them would not fail a local test run — only a fresh CI install. The copy is
# only a second opinion if it is the live one.
souk-provider-sdk = { path = "../souk-provider-sdk", editable = true }
souk-llm-provider-sdk = { path = "../souk-llm-provider-sdk", editable = true }
