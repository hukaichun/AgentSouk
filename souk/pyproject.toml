[project]
name = "souk"
version = "0.1.0"
description = "Agent Souk gateway server — AG-UI + A2A HTTP gateway and gRPC relay to agent-side SDKs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "grpcio>=1.66",
    "sse-starlette>=2.1",
]

[project.scripts]
souk-server = "souk.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk"]
