[project]
name = "souk"
version = "0.1.0"
description = "Agent Souk gateway server — AG-UI + A2A HTTP gateway and gRPC relay to agent-side SDKs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "grpcio>=1.66",
    # Same reasoning as souk-agent-sdk's own pyproject.toml: the
    # generated grpc_gen/*_pb2.py stubs import google.protobuf directly.
    "protobuf>=5.26",
    "sse-starlette>=2.1",
    "ag-ui-protocol>=0.1.19",
    "cryptography>=42.0",
    "pyjwt>=2.9",
]

[project.scripts]
souk-server = "souk.server:main"

# grpcio-tools to regenerate souk/grpc_gen from proto/souk.proto — see
# scripts/gen_proto.sh and this package's Dockerfile. Not a runtime
# dependency (souk only needs grpcio itself, above, once stubs exist).
# pytest/pytest-asyncio/httpx are for souk/tests/ — see CONTRIBUTING.md
# for how to point them at a real Postgres (no ORM/sqlite substitute;
# the schema uses Postgres-specific SQL like JSONB and ON CONFLICT).
[dependency-groups]
dev = ["grpcio-tools>=1.66", "pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk"]
