# Config for `alembic upgrade head`, run from souk/ where this file lives
# (see docs/core-components/persistence.md for the schema tiers).
# sqlalchemy.url below is a placeholder — env.py overrides it with
# souk.config.settings.database_url (SOUK_DATABASE_URL) at runtime.

[alembic]
# The migration chain ships inside the package (souk/alembic), so a
# pip-installed souk builds and upgrades a database the same way this repo
# does — souk.migrate.migrate() is the programmatic entry, this file only
# serves the CLI habit.
script_location = souk:alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname
# Date-prefixed filenames so revisions sort chronologically at a glance
# (rev/down_revision inside each file is still the actual source of
# truth for ordering — this is purely for humans skimming the directory).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
