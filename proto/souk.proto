syntax = "proto3";

package souk;

// gRPC contract between souk (server) and souk-agent-sdk (agent-side client).
//
// Envelopes carry raw AG-UI JSON rather than a fully-typed proto per AG-UI
// event: AG-UI already defines its own JSON event schemas and is still
// evolving (draft event categories), so re-typing every event here would
// mean chasing upstream churn for no real gain at this stage.
service SoukAgentGateway {
  // Called repeatedly by a provider's worker loop to claim work queued for
  // its registered agents. Claiming *is* the hand-over: each pending run
  // comes back with its RunAgentInput, so a worker leaves this call able to
  // start running immediately. There is no follow-up exchange in which souk
  // delivers the input, and therefore no window in which a run has been
  // claimed but its worker is still waiting to be told what to do.
  rpc PollForWork(PollRequest) returns (PollResponse);

  // One persistent, multiplexed, bidirectional stream shared by every run
  // an SDK client currently has in flight. The reference SDK
  // (souk-agent-sdk) opens this only once PollForWork has actually handed
  // it work, and keeps it open only for as long as it keeps finding more
  // — an idle client holds no AgentSession stream at all, just a
  // periodic PollForWork call (see souk_agent_sdk.client for the exact
  // lifecycle). Every run is claimed, delivered, and drained through
  // whichever single connection is currently open — disambiguated by
  // run_id on each envelope — rather than opening a new stream per run.
  //
  // This stream carries a worker's *output*. The run itself was already
  // claimed, with its input, over PollForWork — so per run_id the exchange
  // is only:
  //   1. sdk->souk: zero or more envelopes, each carrying one AG-UI event
  //      JSON for that run_id.
  //   2. sdk->souk: a final envelope for that run_id with end_of_stream
  //      true. Nothing comes back for that run_id afterwards — souk owns
  //      durability from the moment it has the events, and an agent has
  //      no recovery action available if that fails (it has already
  //      produced and discarded them), so there is deliberately no
  //      completion acknowledgement here. Whether a run persisted is a
  //      question its *caller* asks, via the run's own status.
  // souk sends exactly one kind of frame the other way: `cancel` (below),
  // asking a run to stop. (An earlier version of this contract opened with
  // a claim envelope from the SDK and a RunAgentInput envelope back from
  // souk. Both are gone: claiming carries the input now.)
  //
  // A run is addressed by run_id, not by connection — souk checks each
  // frame against the identity that claimed that run rather than against
  // the stream it arrived on. A worker that loses this stream mid-run may
  // therefore reconnect and report the rest, including its end_of_stream,
  // over the new one.
  // Multiple run_ids can be in flight concurrently on the same stream.
  rpc AgentSession(stream AgentEventEnvelope) returns (stream AgentEventEnvelope);
}

message PollRequest {
  repeated string agent_ids = 1;
  // How many more runs this provider can start processing right now
  // (e.g. its concurrency limit minus runs currently in flight). souk
  // hands out at most this many, leaving the rest queued for a later
  // poll — this is how a provider throttles itself instead of souk
  // dumping its whole backlog on every poll regardless of capacity.
  // Unset means unlimited (souk hands out everything queued). Explicitly
  // 0 is a legitimate value distinct from unset — it means "I'm at full
  // capacity, claim nothing this poll" — hence `optional` here rather
  // than relying on proto3's normal zero-value-means-absent default.
  optional int32 max_claim = 2;
  // Long-poll duration: if nothing is queued for these agent_ids, souk
  // holds this call open for up to this many seconds, returning as soon
  // as a run is queued (or empty once the wait times out) rather than
  // making the caller poll again on a fixed timer. Unset or <= 0 means
  // the old behavior — return immediately regardless of whether anything
  // was found.
  optional int32 wait_seconds = 3;
}

message PollResponse {
  repeated PendingRun pending = 1;
}

message PendingRun {
  string run_id = 1;
  // Which of this provider's agents the run is for. AG-UI's RunAgentInput
  // carries thread and run ids but no agent identity, so it travels
  // alongside: a worker hosting several agents looks up the right one with
  // it. Added as a field rather than smuggled into the input, which stays
  // exactly what the protocol says it is.
  string agent_id = 2;
  // The run's RunAgentInput, as JSON — the run's actual input, handed over
  // at claim time rather than delivered afterwards over AgentSession.
  string json_payload = 3;
}

message AgentEventEnvelope {
  string run_id = 1;
  // Informational since claiming carries the input: souk routes every frame
  // by run_id alone and checks it against the identity that claimed that
  // run. Kept because it makes a captured stream readable, and because an
  // SDK already sets it.
  string agent_id = 2;
  string json_payload = 3;
  bool end_of_stream = 4;
  // 5 was `bool ack`: souk->sdk confirmation that a finished run had been
  // fully persisted. Removed — the SDK could only ever log it (it has no
  // replay path if souk failed), while it cost a round trip per run and a
  // 5s stall whenever the frame went astray. Reserved rather than reused
  // so an old SDK's field 5 can never be misread as something else.
  reserved 5;
  // souk->sdk only: souk is *asking* for this run to stop (an explicit
  // A2A tasks/cancel, or a library caller's cancel_run). A request, not a
  // command: souk keeps reading and persisting whatever the run emits
  // afterwards, and a worker that ignores this and finishes normally has
  // finished — souk records `completed`, because that is what it observed.
  // The reference SDK complies by cancelling that run's task (see
  // souk_agent_sdk.client's _handle_run); another worker may legitimately
  // not.
  bool cancel = 6;
}
