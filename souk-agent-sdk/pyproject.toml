[project]
name = "souk-agent-sdk"
version = "0.1.0"
description = "Agent-side SDK: registers a batch of AG-UI-shaped agents with a souk and serves runs over its WebSocket relay"
requires-python = ">=3.12"
dependencies = [
    # The work socket (WS /ws/provider — the frame protocol is authored
    # in the gateway repo's docs/server-mode.md).
    "websockets>=13",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "cryptography>=42.0",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk_agent_sdk"]
