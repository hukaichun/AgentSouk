site_name: Agent Souk
site_description: The network-free agent marketplace core — design, contracts, and guides
site_url: https://hukaichun.github.io/AgentSouk/
repo_url: https://github.com/hukaichun/AgentSouk
repo_name: hukaichun/AgentSouk
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: light mode
  features:
    - navigation.indexes
    - navigation.top
    - content.action.edit
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - The integration contract: integration-contract.md
  - Mechanisms:
      - mechanisms.md
      - Identity is an Ed25519 keypair: mechanisms/identity.md
      - Actor chain: mechanisms/actor-chain.md
      - Runs and cancels are requests: mechanisms/requests.md
      - Provider quality counters: mechanisms/quality.md
      - Keep your own key: mechanisms/kyok.md
      - Responsibility chains: mechanisms/responsibility-chains.md
  - Core components:
      - core-components.md
      - Persistence: core-components/persistence.md
      - The dispatch trunk: core-components/dispatch.md
      - Contract and identity: core-components/contract-identity.md
      - Mechanism to code: core-components/extensions.md
      - Support: core-components/support.md
  - SDKs:
      - sdks.md
      - souk-provider-sdk: sdks/provider-sdk.md
      - souk-llm-provider-sdk: sdks/llm-provider-sdk.md
