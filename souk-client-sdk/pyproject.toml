[project]
name = "souk-client-sdk"
version = "0.1.0"
description = "Caller-side SDK: a thin AG-UI client for talking to agents through a souk"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.9",
    # Only used by souk_client_sdk.kyok_bridge (Keep Your Own Key) — one
    # unified async interface across LLM providers, with streaming chunks
    # already OpenAI-shaped, matching souk's /kyok/v1 wire format exactly.
    "litellm>=1.95",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk_client_sdk"]
