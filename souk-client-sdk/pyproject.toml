[project]
name = "souk-client-sdk"
version = "0.1.0"
description = "Caller-side SDK: a thin AG-UI client for talking to agents through a souk"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk_client_sdk"]
